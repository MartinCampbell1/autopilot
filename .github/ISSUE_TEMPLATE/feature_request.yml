name: Feature request
description: Propose a product improvement or new workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or founder problem is not solved today?
      placeholder: Teams cannot see final handoff state from the main workspace without opening story detail.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
      placeholder: Add a project-level delivery summary showing source, brief, execution status, and final handoff.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why this fits the product
      description: Explain how the request supports deterministic orchestration, operator trust, or local-first execution.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and tradeoffs
      description: Call out alternatives, compatibility concerns, or why this should not stay deferred.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Links to docs, screenshots, related issue IDs, or example workflows
