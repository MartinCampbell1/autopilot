[project]
name = "autopilot"
version = "0.1.0"
description = "Autonomous AI programmer platform with account rotation and critic loops"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.urls]
Repository = "https://github.com/MartinCampbell1/autopilot"
Issues = "https://github.com/MartinCampbell1/autopilot/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27.0,<1.0.0",
]
notify = [
    "python-telegram-bot>=21.0",
]

[project.scripts]
autopilot = "autopilot.cli.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
